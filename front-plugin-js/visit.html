<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <title>Visit Flow - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const VISIT_CONTEXT_KEY = "visitContext";

      const goHome = () => {
        location.href = "home.html";
      };

      const isValidMode = (mode) => mode === "checkin" || mode === "checkout";

      const getMode = () => {
        const params = new URLSearchParams(location.search);
        const mode = params.get("mode");
        if (isValidMode(mode)) {
          try {
            sessionStorage.setItem("visitMode", mode);
          } catch {}
          return mode;
        }

        // Some environments may drop/override query params; fall back to a prior explicit choice.
        try {
          const stored = sessionStorage.getItem("visitMode");
          if (isValidMode(stored)) return stored;
        } catch {}

        return "checkout";
      };

      const getStep = () => {
        const params = new URLSearchParams(location.search);
        return params.get("step");
      };

      const MODE = getMode();
      const STEP = getStep();
      const PATIENT_ACTION_LABEL = MODE === "checkin" ? "접수" : "조회";

      const ctx = {
        mode: MODE,
        patient: null,
        room: null,
        doctor: null,
        bill: null,
      };

      const ROOMS = [
        {
          id: "room-1",
          title: "제 1 진료실",
          subtitle: "피부·리프팅 상담",
          description: "진료 가능",
        },
        {
          id: "room-2",
          title: "제 2 진료실",
          subtitle: "레이저·색소 상담",
          description: "진료 가능",
        },
      ];

      const DOCTORS = [
        {
          id: "doc-1",
          title: "김토스 원장",
          subtitle: "피부과",
          description: "진료 가능",
        },
        {
          id: "doc-2",
          title: "박플레이 원장",
          subtitle: "피부과",
          description: "진료 가능",
        },
      ];

      const formatIdentification = (value) => {
        const digits = String(value ?? "").replace(/\D/g, "");
        if (digits.length <= 6) return digits;
        return `${digits.slice(0, 6)}-${digits.slice(6, 13)}`;
      };

      const maskIdentification = (value) => {
        const digits = String(value ?? "").replace(/\D/g, "");
        if (digits.length < 6) return "";
        const front = digits.slice(0, 6);
        return `${front}-*******`;
      };

      const renderPatientPhone = () => {
        sdk.template.renderInputPage({
          type: "phone",
          top: {
            title: "전화번호를 입력해주세요",
            subtitle: MODE === "checkin" ? "접수하실" : "수납 조회하실",
          },
          input: {
            placeholder: "전화번호 입력",
            onChange: (value) => {
              ctx.patient = { ...(ctx.patient ?? {}), phone: value };
            },
          },
          button: {
            label: PATIENT_ACTION_LABEL,
          },
          onSubmit: async (value) => {
            ctx.patient = { ...(ctx.patient ?? {}), phone: value };
            renderPatientIdentification();
          },
          onBack: () => {
            goHome();
          },
        });
      };

      const renderPatientIdentification = () => {
        sdk.template.renderInputPage({
          type: "identification",
          top: {
            title: "주민등록번호를 입력해주세요",
            subtitle: MODE === "checkin" ? "접수하실" : "수납 조회하실",
          },
          disclaimer: "병원 진료 업무 외 다른 용도로 사용하지 않아요.",
          input: {
            onChange: (value) => {
              ctx.patient = {
                ...(ctx.patient ?? {}),
                identification: formatIdentification(value),
              };
            },
          },
          button: {
            label: PATIENT_ACTION_LABEL,
          },
          onSubmit: async (value) => {
            ctx.patient = {
              ...(ctx.patient ?? {}),
              identification: formatIdentification(value),
            };
            if (MODE === "checkout") {
              renderCheckoutBillSelect();
              return;
            }
            renderSelectRoom();
          },
          onBack: () => {
            renderPatientPhone();
          },
        });
      };

      const formatKRW = (amount) => {
        try {
          return new Intl.NumberFormat("ko-KR").format(amount);
        } catch {
          return String(amount);
        }
      };

      const renderCheckoutBillSelect = () => {
        const patientPhone = ctx.patient?.phone ?? "";
        const patientIdentification = ctx.patient?.identification ?? "";
        const patientLabel = patientIdentification
          ? maskIdentification(patientIdentification)
          : "";

        // 데모용 더미 수납 내역 (추후 서버 조회로 교체 가능)
        const bills = [
          {
            id: "bill-1",
            title: "울쎄라 리프팅 (600샷)",
            subtitle: `${patientLabel} (${patientPhone})`,
            description: `진료일: 2026.01.08 · 미수납 · ${formatKRW(4130000)}원`,
          },
          {
            id: "bill-2",
            title: "피부 레이저 토닝 (10회)",
            subtitle: `${patientLabel} (${patientPhone})`,
            description: `진료일: 2026.01.03 · 미수납 · ${formatKRW(990000)}원`,
          },
        ];

        sdk.template.renderSearchPage({
          top: {
            title: "수납할 내역을\n선택해주세요",
            subtitle: "수납 조회",
          },
          input: {
            placeholder: "시술명 검색",
          },
          getOptions: async ({ keyword }) => {
            const k = (keyword ?? "").trim();
            if (k.length === 0) return bills;
            return bills.filter((b) => (b.title ?? "").includes(k));
          },
          onSubmit: (item) => {
            ctx.bill = item;
            completeFlow();
          },
          onBack: () => {
            renderPatientIdentification();
          },
        });
      };

      const fallbackSearchSingleSelect = ({ title, placeholder, options, onPick, onBack }) => {
        sdk.template.renderSearchPage({
          top: { title },
          input: { placeholder },
          getOptions: async ({ keyword }) => {
            const k = (keyword ?? "").trim();
            if (k.length === 0) return options;
            return options.filter((o) => (o.title ?? "").includes(k));
          },
          onSubmit: (item) => {
            onPick(item);
          },
          onBack,
        });
      };

      const renderMultiSelectOrFallback = ({ title, options, onPick, onBack }) => {
        // 안정성을 위해 (그리고 완전 로컬 동작을 위해) MultiSelect는 공식 Params를 확인한 뒤에 적용합니다.
        // 현재는 검증된 템플릿인 renderSearchPage로 단일 선택을 처리합니다.
        fallbackSearchSingleSelect({
          title,
          placeholder: "검색",
          options,
          onPick,
          onBack,
        });
      };

      const renderSelectRoom = () => {
        renderMultiSelectOrFallback({
          title: "진료실을 선택해주세요",
          options: ROOMS,
          onPick: (room) => {
            ctx.room = room;
            renderSelectDoctor();
          },
          onBack: () => {
            renderPatientIdentification();
          },
        });
      };

      const renderSelectDoctor = () => {
        renderMultiSelectOrFallback({
          title: "의사 선생님을 선택해주세요",
          options: DOCTORS,
          onPick: (doctor) => {
            ctx.doctor = doctor;
            completeFlow();
          },
          onBack: () => {
            renderSelectRoom();
          },
        });
      };

      const completeFlow = async () => {
        await sdk.storage.set({ key: VISIT_CONTEXT_KEY, value: JSON.stringify(ctx) });

        if (MODE === "checkout") {
          location.href = "order.html";
          return;
        }

        // checkin: show a simple confirmation page (template-only) and return home after a timer.
        sdk.template.openToast({
          message: "접수되었습니다",
          icon: "success",
        });

        const patientName = ctx.patient?.name ? `${ctx.patient.name}님` : "고객님";
        const roomTitle = ctx.room?.title ?? "-";
        const doctorTitle = ctx.doctor?.title ?? "-";

        // Prefer a dedicated result screen to match the reference UI.
        // If unsupported in the current environment, fall back to idle page.
        try {
          sdk.template.renderResultPage({
            type: "image",
            status: "success",
            title: "지금 진료실로 들어오세요",
            description: `접수완료!\n\n진료실: ${roomTitle}\n담당의: ${doctorTitle}`,
            buttons: [
              {
                label: "처음으로",
                onClick: () => {
                  goHome();
                },
                closeOnClick: true,
              },
            ],
            timerMs: 10000,
            onTimeout: () => {
              goHome();
            },
            localeCode: "ko",
          });
        } catch (e) {
          sdk.template.renderIdlePage({
            type: "oneButton",
            description: {
              text: `${patientName}, 접수완료!\n${roomTitle}\n${doctorTitle}`,
            },
            button: {
              text: "처음으로",
              onClick: () => {
                goHome();
              },
            },
          });

          sdk.template.startTimer({
            title: "잠시 후 처음으로 이동할게요",
            duration: 10,
            warnAt: 3,
            onTimeout: () => {
              goHome();
            },
          });
        }
      };

      const bootstrap = async () => {
        // Restore prior state when coming back from payment flow (e.g. step=billSelect)
        const { value: saved } = await sdk.storage.get({ key: VISIT_CONTEXT_KEY });
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed?.mode === MODE) {
              Object.assign(ctx, parsed);
            }
          } catch {}
        }

        if (MODE === "checkout" && STEP === "billSelect") {
          renderCheckoutBillSelect();
          return;
        }

        renderPatientPhone();
      };

      bootstrap();
    </script>
  </body>
</html>
