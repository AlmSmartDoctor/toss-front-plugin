<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <title>Order Example - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      sdk.template.renderOnboardingPage({
        title: "서비스 로그인 (예시)",
        inputs: {
          email: {
            label: "이메일",
            type: "text",
            placeholder: "이메일을 입력해주세요",
          },
          password: {
            label: "비밀번호",
            type: "password",
            placeholder: "비밀번호를 입력해주세요",
          },
        },
        navbarButton: {
          label: '설정',
          onClick: () => {
              sdk.app.openSetting();
          },
        },
        onSubmit: async (values) => {
          // 데모용: 실제 API 호출 없이 입력값을 그대로 저장하고 다음 화면으로 이동합니다.
          // (index.html의 token 체크를 통과시키기 위한 용도)
          const token = JSON.stringify({
            ...values,
            loggedInAt: Date.now(),
          });
          await sdk.storage.set({ key: "token", value: token });
          location.href = "./home.html";
        },
      });
    </script>
  </body>
</html>
