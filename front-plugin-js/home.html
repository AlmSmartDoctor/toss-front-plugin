<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <title>Order Example - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      sdk.template.renderIdlePage({
        type: "twoButton",
        title: {
          text1: "여기서",
          text2: "접수·수납",
          text3: "해주세요",
        },
        description: {
          text: "아래에서 원하는 메뉴를 선택해주세요",
        },
        primaryButton: {
          text: "접수하기",
          onClick: () => {
            try {
              sessionStorage.setItem("visitMode", "checkin");
            } catch {}
            location.href = "visit.html?mode=checkin";
          },
        },
        secondaryButton: {
          text: "수납하기",
          onClick: () => {
            try {
              sessionStorage.setItem("visitMode", "checkout");
            } catch {}
            location.href = "visit.html?mode=checkout";
          },
        },
      });
    </script>
  </body>
</html>
