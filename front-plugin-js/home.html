<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://static.toss.im/tds/43.9.4/css/tds.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://static.toss.im/tps/others.css"
    />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <title>Order Example - Toss Front SDK</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const DEFAULT_HOSPITAL_NAME = "메이퓨어 강남점";

      const getScenario = () => {
        const params = new URLSearchParams(location.search);
        return params.get("scenario") ?? "eligible";
      };

      const loadHospitalName = async () => {
        try {
          const merchant = await sdk.app.getMerchant();
          if (merchant?.name) return merchant.name;
        } catch {}
        return DEFAULT_HOSPITAL_NAME;
      };

      const renderIdle = async () => {
        const hospitalName = await loadHospitalName();

        sdk.template.renderIdlePage({
          type: "oneButton",
          description: {
            text: hospitalName,
          },
          button: {
            text: "메디케시 사용",
            onClick: () => {
              // TODO: replace button click with websocket-triggered auto navigation.
              const scenario = getScenario();
              location.href = `order.html?scenario=${encodeURIComponent(scenario)}`;
            },
          },
        });
      };

      renderIdle();
    </script>
  </body>
</html>
