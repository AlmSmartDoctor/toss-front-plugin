<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://static.toss.im/tds/43.9.4/css/tds.min.css" />
  <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/main.css" />
  <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/others.css" />
  <link rel="stylesheet" type="text/css" href="./global.css" />
  <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
  <script src="./sdk.js"></script>
  <title>Order Example - Toss Front SDK</title>
</head>

<body>
  <div id="app"></div>
  <script>
    const DEFAULT_HOSPITAL_NAME = "메이퓨어 강남점";
    const MIN_POINT_UNIT = 100;

    const SCENARIOS = {
      eligible: {
        treatmentAmount: 16400,
        availablePoint: 5000,
        minimumUsablePoint: 1000,
        earnedPoint: 200,
        mockResult: "sdk",
      },
      insufficient: {
        treatmentAmount: 16400,
        availablePoint: 300,
        minimumUsablePoint: 1000,
        earnedPoint: 200,
        mockResult: "sdk",
      },
      paymentFailure: {
        treatmentAmount: 16400,
        availablePoint: 5000,
        minimumUsablePoint: 1000,
        earnedPoint: 200,
        mockResult: "failure",
        failureReason: "잔액 부족",
      },
      paymentSuccessMock: {
        treatmentAmount: 16400,
        availablePoint: 5000,
        minimumUsablePoint: 1000,
        earnedPoint: 200,
        mockResult: "success",
      },
    };

    const flowState = {
      hospitalName: DEFAULT_HOSPITAL_NAME,
      treatmentAmount: 0,
      availablePoint: 0,
      minimumUsablePoint: 0,
      earnedPoint: 0,
      usablePoint: 0,
      pointUsedAmount: 0,
      paymentAmount: 0,
      mockResult: "sdk",
      failureReason: "통신 오류",
      paymentMethodLabel: "카드",
    };

    const formatNumber = (amount) => {
      try {
        return new Intl.NumberFormat("ko-KR").format(amount);
      } catch {
        return String(amount);
      }
    };

    const getScenario = () => {
      const params = new URLSearchParams(location.search);
      const scenario = params.get("scenario");
      if (!scenario) return SCENARIOS.eligible;
      return SCENARIOS[scenario] ?? SCENARIOS.eligible;
    };

    const buildPaymentKey = () => {
      const now = Date.now();
      return `medicash-${now}`;
    };

    const goIdle = async () => {
      try {
        await sdk.app.setIdle();
        return;
      } catch {}
      location.href = "home.html";
    };

    const calculateUsablePoint = ({ treatmentAmount, availablePoint }) => {
      const maxUsable = Math.min(treatmentAmount, availablePoint);
      return Math.floor(maxUsable / MIN_POINT_UNIT) * MIN_POINT_UNIT;
    };

    const buildOrderPayload = () => {
      const discounts =
        flowState.pointUsedAmount > 0
          ? [
            {
              label: "메디케시 사용",
              value: flowState.pointUsedAmount,
            },
          ]
          : [];

      return {
        items: [
          {
            label: "진료 금액",
            quantity: 1,
            value: flowState.treatmentAmount,
          },
        ],
        discounts,
        summary: {
          totalAmount: flowState.paymentAmount,
          discountAmount: flowState.pointUsedAmount > 0 ? flowState.pointUsedAmount : undefined,
          earned: {
            label: "이번 결제 적립",
            value: flowState.earnedPoint,
            suffix: "캐",
          },
        },
      };
    };

    const renderPaymentSuccessPage = () => {
      sdk.template.renderResultPage({
        type: "image",
        status: "success",
        title: "수납 완료",
        description: `${flowState.hospitalName}에\n방문해주셔서 감사합니다`,
        timerMs: 5000,
        onTimeout: () => {
          goIdle();
        },
        buttons: [
          {
            label: "확인",
            onClick: () => {
              goIdle();
            },
            closeOnClick: true,
          },
        ],
        localeCode: "ko",
      });
    };

    const renderPaymentFailurePage = () => {
      const summaryItems = [
        {
          label: "취소 사유",
          value: flowState.failureReason,
          theme: "red",
        },
        {
          label: "결제 수단",
          value: flowState.paymentMethodLabel,
          theme: "blue",
        },
      ];

      if (flowState.pointUsedAmount > 0) {
        summaryItems.push({
          label: "메디케시 사용",
          value: `-${formatNumber(flowState.pointUsedAmount)}캐`,
          theme: "blue",
        });
      }

      sdk.template.renderOrderResultPage({
        order: {
          items: [
            {
              label: "진료 금액",
              quantity: 1,
              value: flowState.treatmentAmount,
            },
          ],
          summary: {
            totalAmount: flowState.paymentAmount,
            items: summaryItems,
          },
        },
        cta: {
          text: "다시 결제하기",
          onClick: () => {
            requestPayment();
          },
        },
      });
    };

    const requestPayment = async () => {
      if (flowState.paymentAmount <= 0) {
        renderPaymentSuccessPage();
        return;
      }

      if (flowState.mockResult === "success") {
        renderPaymentSuccessPage();
        return;
      }

      if (flowState.mockResult === "failure") {
        renderPaymentFailurePage();
        return;
      }

      const tax = Math.floor(flowState.paymentAmount / 11);
      const supplyValue = flowState.paymentAmount - tax;

      try {
        const result = await sdk.payment.requestPayment({
          paymentKey: buildPaymentKey(),
          tax,
          supplyValue,
          tip: 0,
          timeoutMs: 60000,
          localeCode: "ko",
        });

        if (result.type === "TIMEOUT") {
          flowState.failureReason = "시간 초과";
          renderPaymentFailurePage();
          return;
        }

        if (result.type === "CANCELED") {
          flowState.failureReason = "승인 거절";
          renderPaymentFailurePage();
          return;
        }

        const paymentMethod = result?.response?.paymentMethod ?? "CARD";
        flowState.paymentMethodLabel = paymentMethod === "BARCODE" ? "간편결제" : paymentMethod === "CASH" ? "현금" : "카드";

        // TODO: store approval info (paymentKey/timestamp/approvalNumber) to backend for reconciliation/cancel.
        renderPaymentSuccessPage();
      } catch {
        flowState.failureReason = "통신 오류";
        renderPaymentFailurePage();
      }
    };

    const renderOrderConfirmPage = () => {
      sdk.template.renderOrderPage({
        localeCode: "ko",
        order: buildOrderPayload(),
        onClick: () => {
          requestPayment();
        },
      });
    };

    const renderUsePointPage = () => {
      const paymentAmountWhenAllUsed = Math.max(
        0,
        flowState.treatmentAmount - flowState.usablePoint
      );

      sdk.template.renderUsePointPage({
        points: [
          {
            name: "메디케시",
            amount: flowState.availablePoint,
          },
        ],
        summary: {
          pointUsedAmount: flowState.usablePoint,
          paymentAmount: paymentAmountWhenAllUsed,
        },
        cta: {
          cancel: {
            onClick: () => {
              flowState.pointUsedAmount = 0;
              flowState.paymentAmount = flowState.treatmentAmount;
              renderOrderConfirmPage();
            },
          },
          submit: {
            onClick: () => {
              flowState.pointUsedAmount = flowState.usablePoint;
              flowState.paymentAmount = Math.max(
                0,
                flowState.treatmentAmount - flowState.pointUsedAmount
              );
              renderOrderConfirmPage();
            },
          },
        },
        onBack: () => {
          goIdle();
        },
      });
    };

    const loadHospitalName = async () => {
      try {
        const merchant = await sdk.app.getMerchant();
        if (merchant?.name) {
          flowState.hospitalName = merchant.name;
        }
      } catch {}
    };

    const bootstrap = async () => {
      await loadHospitalName();

      // TODO: replace scenario mocks with websocket/backend payload contract.
      const scenario = getScenario();
      flowState.treatmentAmount = scenario.treatmentAmount;
      flowState.availablePoint = scenario.availablePoint;
      flowState.minimumUsablePoint = scenario.minimumUsablePoint;
      flowState.earnedPoint = scenario.earnedPoint;
      flowState.mockResult = scenario.mockResult;
      flowState.failureReason = scenario.failureReason ?? "통신 오류";
      flowState.paymentMethodLabel = "카드";
      flowState.usablePoint = calculateUsablePoint(scenario);
      flowState.pointUsedAmount = 0;
      flowState.paymentAmount = flowState.treatmentAmount;

      if (flowState.usablePoint < flowState.minimumUsablePoint) {
        renderOrderConfirmPage();
        return;
      }

      renderUsePointPage();
    };

    bootstrap();
  </script>
</body>

</html>
